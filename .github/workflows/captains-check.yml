name: Captain's Check
# Automatic health check on every push and pull request. Free on GitHub Actions.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (no keys or passwords in code)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node project - install, build, test
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ] || [ -f pnpm-workspace.yaml ] || grep -q 'Use pnpm' package.json; then
            echo "Package manager: pnpm"
            npm install -g pnpm@latest --silent
            pnpm install --frozen-lockfile || pnpm install
            pnpm run --if-present build
            pnpm run --if-present test
          else
            echo "Package manager: npm"
            if [ -f package-lock.json ]; then npm ci || npm install --legacy-peer-deps --no-audit --no-fund; else npm install --legacy-peer-deps --no-audit --no-fund; fi
            npm run build --if-present
            npm test --if-present
          fi
      - name: Set up Python
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python project - syntax check and tests
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          python -m compileall -q -x '(node_modules|\.venv)' .
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if ls tests test_*.py */test_*.py >/dev/null 2>&1; then pip install pytest && pytest -q; fi
      - name: HTML files - basic check
        run: |
          echo "HTML files: $(find . -name '*.html' -not -path './node_modules/*' | wc -l)"
          find . -name '*.html' -not -path './node_modules/*' -print0 | xargs -0 -r grep -L -i '<meta charset' | sed 's/^/Missing charset: /' || true
